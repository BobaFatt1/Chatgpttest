name: Build TrustTunnel Anti-DPI APK

on:
  push:
    paths:
      - 'apply_anti_dpi.py'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GPR_KEY: ${{ secrets.GPR_KEY }}
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4
      - name: Checkout official TrustTunnel v1.2.0
        uses: actions/checkout@v4
        with:
          repository: TrustTunnel/TrustTunnelFlutterClient
          ref: v1.2.0
          path: app
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Apply Anti-DPI patch
        run: python3 apply_anti_dpi.py app
      - name: Configure Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Initialize project
        working-directory: app
        run: make init
      - name: Run Anti-DPI test
        working-directory: app
        run: flutter test test/anti_dpi_feature_test.dart
      - name: Build Android debug APK (arm64)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-antidpi-debug-arm64
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
